[project]
name = "project5"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "django (==5.2.10)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "ipython (>=9.9.0,<10.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt[crypto] (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "stripe (>=14.1.0,<15.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "drf-yasg (>=1.21.11,<2.0.0)",
    "eventlet (>=0.40.4,<0.41.0)",
    "coverage (>=7.13.1,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119

[tool.isort]
profile='black'
